<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Quizy 1LO – logowanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7efdd}
a{color:#24406e}a:hover{color:#4a6390}
.wavy{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:#e2543e;text-decoration-thickness:2.5px;text-underline-offset:7px;text-decoration-skip-ink:none}
.btn-ghost:hover{background:#ecdcba !important}
.btn-accent:hover{background:#e2622b !important}
.btn-ghost:active,.btn-accent:active{transform:translateY(2px)}
.field:focus{border-color:#f2803e !important;background:#ffffff !important;outline:none;box-shadow:3px 3px 0 rgba(242,128,62,0.35)}
.field::placeholder{color:rgba(51,48,42,0.45)}
.peek:hover{background:#ecdcba !important}
@keyframes float-squiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.float-squiggle{animation:float-squiggle 2.6s ease-in-out infinite}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 0 24px 56px; font-family: Poppins, ui-sans-serif, system-ui, sans-serif; color: #33302a; background-color: #f7efdd; background-image: radial-gradient(rgba(206, 160, 96, 0.5) 1.2px, transparent 1.4px), radial-gradient(rgba(206, 160, 96, 0.28) 1.2px, transparent 1.4px); background-size: 22px 22px; background-position: 0 0, 11px 11px">

  <header style="max-width: 1120px; margin: 0 auto; padding: 24px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <a href="quizy.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #f2803e; flex-shrink: 0"></span>
      <span style="font-size: 22px; font-weight: 800; color: #24406e; letter-spacing: -0.01em">Quizy 1LO</span>
    </a>
    <a href="quizy.html" class="btn-ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; box-sizing: border-box; padding: 0 18px; border-radius: 16px; border: 2px solid #24406e; background: transparent; color: #24406e; font-size: 16px; font-weight: 700; text-decoration: none; transition: background 0.15s">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Lista quizów
    </a>
  </header>

  <main style="max-width: 460px; margin: 48px auto 0; position: relative">
    <svg class="float-squiggle" viewBox="0 0 48 96" fill="none" aria-hidden="true" style="position: absolute; top: 84px; left: 28px; width: 40px; height: 80px; color: #24406e">
      <path d="M25 6C11 18 39 30 25 44C13 55 36 66 25 82" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
      <path d="M13 70L25 86L37 69" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>

    <h1 style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 48px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; color: #24406e; text-align: center">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #f2803e; flex-shrink: 0"></span>
      <span>Zaloguj <span class="wavy">się</span></span>
    </h1>
    <p style="margin: 10px 0 0; text-align: center; font-size: 16px; color: #5a5348">Panel twórców quizów</p>

    <form onsubmit="return false" style="margin-top: 88px; background: #ecdcba; border: 2px solid rgba(36, 64, 110, 0.15); border-radius: 24px; padding: 28px; box-shadow: 6px 6px 0 rgba(36, 64, 110, 0.12); display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 16px; font-weight: 700; color: #24406e">E-mail szkolny</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="imie.nazwisko@1lo.gniezno.pl" class="field" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 12px 16px; border-radius: 16px; border: 2px solid rgba(36, 64, 110, 0.25); background: #f7efdd; font-family: inherit; font-size: 16px; color: #33302a; transition: border-color 0.15s, background 0.15s">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <label for="password" style="font-size: 16px; font-weight: 700; color: #24406e">Hasło</label>
          <a href="mailto:kowalski.mateusz@1lo.gniezno.pl?subject=Reset%20has%C5%82a%20%E2%80%93%20Quizy%201LO" style="font-size: 14px; font-weight: 600">Nie pamiętasz hasła?</a>
        </div>
        <div style="position: relative">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" class="field" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 12px 60px 12px 16px; border-radius: 16px; border: 2px solid rgba(36, 64, 110, 0.25); background: #f7efdd; font-family: inherit; font-size: 16px; color: #33302a; transition: border-color 0.15s, background 0.15s">
          <button type="button" aria-label="Pokaż hasło" class="peek" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 12px; background: transparent; color: #24406e; cursor: pointer">
            <!-- Po kliknięciu: type="text", aria-label="Ukryj hasło" i ikona eye-off:
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.6 3.2M6.5 7.6C4.3 9.2 3 12 3 12s4 6 9 6a8.6 8.6 0 0 0 4.4-1.2"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
-->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-accent" style="margin-top: 4px; min-height: 54px; width: 100%; border-radius: 16px; border: 2px solid #24406e; background: #f2803e; color: #1d3459; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 rgba(36, 64, 110, 0.18); transition: background 0.15s">Zaloguj się</button>
    </form>

    <p style="margin: 24px 0 0; text-align: center; font-size: 14px; line-height: 1.6; color: #5a5348">Do rozwiązywania quizów konto nie jest potrzebne.<br>Chcesz stworzyć quiz? Napisz: <a href="mailto:kowalski.mateusz@1lo.gniezno.pl" style="font-weight: 600">kowalski.mateusz@1lo.gniezno.pl</a></p>
  </main>
</div>
</body>
</html>
